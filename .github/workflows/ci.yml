name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'
jobs:
  frontend-quality:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: kalana-ci

    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck app + web
        run: bun run typecheck

      - name: Check JavaScript correctness
        run: bunx biome lint app web tauri landing --only=correctness/noUnreachable --only=correctness/useHookAtTopLevel --only=suspicious/noDoubleEquals

      - name: Build web smoke test
        run: bun run build:web

      - name: Build desktop frontend
        run: bun run --filter @voicebox/tauri build

      - name: Build landing site
        run: bun run build:landing

  backend-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: kalana-ci
    timeout-minutes: 25
    env:
      PYTHONPATH: .:backend
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.13.0
          python-version: "3.12"
          activate-environment: true
          venv-path: ${{ runner.temp }}/backend-ci-python
          no-project: true
          enable-cache: true
      - name: Install locked CPU unit-test dependencies
        run: uv pip install --python "$VIRTUAL_ENV/bin/python" --require-hashes --torch-backend cpu --default-index https://pypi.org/simple -r backend/requirements-ci.txt
      - name: Check Python syntax and invalid control flow
        run: uvx --from ruff==0.17.2 ruff check backend --select E9,F63,F7,F82
      - name: Run deterministic backend tests
        # These six files are interactive/server/model evaluation scripts;
        # they require a running backend and downloaded model weights.
        run: |
          python -m pytest backend/tests -q --timeout=120 \
            --ignore=backend/tests/test_generation_download.py \
            --ignore=backend/tests/test_qwen_download.py \
            --ignore=backend/tests/test_whisper_download.py \
            --ignore=backend/tests/test_all_models_e2e.py \
            --ignore=backend/tests/test_refinement_samples.py \
            --ignore=backend/tests/test_personality_samples.py \
            --junitxml=test-results/backend.xml
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/*.xml

  native-desktop:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ matrix.platform == 'windows-latest' && 'windows-latest' || fromJSON('["self-hosted","kalana-macos-ci","macOS"]') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Prepare development sidecars and frontend
        run: |
          bun run setup:dev
          bun run --filter @voicebox/tauri build
      - name: Check Swift and Apple asset toolchain
        if: runner.os == 'macOS'
        run: |
          xcrun --find swift
          xcrun --find actool
      - name: Compile all native desktop targets
        run: cargo check --manifest-path tauri/src-tauri/Cargo.toml --all-targets --locked
